<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkpoints Studio — Telecos Drawing QA Validator</title>
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand brand">
        <span class="regmark"><span class="dot"></span></span>
        <div>TELECOS QA<small>Multimodal AI Engine</small></div>
      </div>
      <nav>
        <a class="nav-link" href="/static/operation.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Validate Drawing
        </a>
        <a class="nav-link" href="/static/report.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Audit Report (PDF)
        </a>
        <a class="nav-link active" href="/static/admin.html" id="navAdmin">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Checkpoints Studio
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div id="sidebarUsername">Lead Engineer</div>
          <div class="role" id="sidebarRole">ADMIN</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-block" id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1>Checkpoints Studio</h1>
        <p>Active Optus BA compliance rules and standard image pairs loaded into the Gemma-4 vision pipeline.</p>
      </div>

      <div class="card" style="overflow:hidden;">
        <div style="padding:16px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
          <h3 style="margin:0;">Active Rule Definitions (71 Rules)</h3>
          <input type="text" id="adminSearch" placeholder="Filter checkpoints…" style="padding:6px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); font-size:12px; outline:none; width:220px;" />
        </div>
        <div id="adminList">
          <div style="padding:24px; text-align:center; color:var(--text-muted);">
            <span class="spinner"></span> Loading active rule catalog…
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/api.js?v=2.2"></script>
  <script src="/static/js/admin.js"></script>
</body>
</html>
